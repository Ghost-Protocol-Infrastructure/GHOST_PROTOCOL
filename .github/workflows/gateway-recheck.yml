name: Gateway Canary Recheck

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to call (defaults to production)"
        required: false
        default: "https://www.ghostprotocol.cc"
        type: string
      limit:
        description: "Max LIVE gateway configs to process"
        required: false
        default: "100"
        type: string
      degraded_limit:
        description: "Max DEGRADED gateway configs to retry"
        required: false
        default: "20"
        type: string
      dry_run:
        description: "Run selection/stale sweep without canary fetches"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: gateway-canary-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invoke gateway recheck endpoint
        env:
          RECHECK_SECRET: ${{ secrets.GHOST_AGENT_GATEWAY_RECHECK_SECRET }}
          BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
          DEGRADED_LIMIT_INPUT: ${{ github.event.inputs.degraded_limit }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${RECHECK_SECRET:-}" ]; then
            echo "Missing repo secret GHOST_AGENT_GATEWAY_RECHECK_SECRET" >&2
            exit 1
          fi

          base_url="${BASE_URL_INPUT:-https://www.ghostprotocol.cc}"
          base_url="${base_url%/}"
          if [ "${base_url}" = "https://ghostprotocol.cc" ]; then
            base_url="https://www.ghostprotocol.cc"
          fi
          live_limit="${LIMIT_INPUT:-100}"
          degraded_limit="${DEGRADED_LIMIT_INPUT:-20}"
          dry_run="${DRY_RUN_INPUT:-false}"

          call_recheck() {
            local label="$1"
            local url="$2"
            local output_file="$3"

            echo "Calling ${label}: ${url}"
            local http_code
            http_code="$(curl -sS -o "${output_file}" -w '%{http_code}' \
              -H "Authorization: Bearer ${RECHECK_SECRET}" \
              -H "Accept: application/json" \
              "${url}")"

            cat "${output_file}"
            echo

            if [ "${http_code}" != "200" ]; then
              echo "${label} failed with HTTP ${http_code}" >&2
              exit 1
            fi
          }

          live_url="${base_url}/api/agent-gateway/recheck?statuses=LIVE&limit=${live_limit}"
          degraded_url="${base_url}/api/agent-gateway/recheck?statuses=DEGRADED&limit=${degraded_limit}"
          if [ "${dry_run}" = "true" ]; then
            live_url="${live_url}&dryRun=1"
            degraded_url="${degraded_url}&dryRun=1"
          fi

          call_recheck "LIVE gateway recheck" "${live_url}" "response-live.json"
          call_recheck "DEGRADED gateway retry" "${degraded_url}" "response-degraded.json"
