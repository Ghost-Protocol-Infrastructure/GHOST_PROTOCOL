name: Fulfillment Expire Sweep

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to call (defaults to production)"
        required: false
        default: "https://www.ghostprotocol.cc"
        type: string
      limit:
        description: "Max expired holds to process"
        required: false
        default: "250"
        type: string
      dry_run:
        description: "Select candidates only (no state changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # GitHub Actions scheduled workflows are best-effort and support a minimum
    # interval of once every 5 minutes. Offset away from the top of the hour
    # to reduce delay during common high-load windows.
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: fulfillment-expire-sweep
  cancel-in-progress: false

jobs:
  expire-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invoke fulfillment expire-sweep endpoint
        env:
          EXPIRE_SWEEP_SECRET: ${{ secrets.GHOST_FULFILLMENT_EXPIRE_SWEEP_SECRET }}
          BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${EXPIRE_SWEEP_SECRET:-}" ]; then
            echo "Missing repo secret GHOST_FULFILLMENT_EXPIRE_SWEEP_SECRET" >&2
            exit 1
          fi

          base_url="${BASE_URL_INPUT:-https://www.ghostprotocol.cc}"
          base_url="${base_url%/}"
          if [ "${base_url}" = "https://ghostprotocol.cc" ]; then
            base_url="https://www.ghostprotocol.cc"
          fi

          limit="${LIMIT_INPUT:-250}"
          dry_run="${DRY_RUN_INPUT:-false}"

          url="${base_url}/api/fulfillment/expire-sweep?limit=${limit}"
          if [ "${dry_run}" = "true" ]; then
            url="${url}&dryRun=1"
          fi

          call_json_endpoint() {
            local url="$1"
            local response_file="$2"
            local http_code=""
            local curl_exit=0
            local attempt=1
            local max_attempts=3

            while [ "${attempt}" -le "${max_attempts}" ]; do
              echo "Attempt ${attempt}/${max_attempts}: GET ${url}"
              set +e
              http_code="$(curl -sS -o "${response_file}" -w '%{http_code}' \
                --connect-timeout 10 \
                --max-time 60 \
                -H "Authorization: Bearer ${EXPIRE_SWEEP_SECRET}" \
                -H "Accept: application/json" \
                "${url}")"
              curl_exit=$?
              set -e

              if [ "${curl_exit}" -eq 0 ] && [ "${http_code}" = "200" ]; then
                return 0
              fi

              if [ "${curl_exit}" -ne 0 ]; then
                echo "Fulfillment expire-sweep curl failed with exit ${curl_exit}." >&2
              else
                echo "Fulfillment expire-sweep endpoint returned HTTP ${http_code}." >&2
              fi

              if [ "${attempt}" -lt "${max_attempts}" ] && { [ "${curl_exit}" -ne 0 ] || [ "${http_code}" = "408" ] || [ "${http_code}" = "429" ] || [[ "${http_code}" =~ ^5 ]]; }; then
                sleep_for=$((attempt * 10))
                echo "Retrying in ${sleep_for}s..." >&2
                sleep "${sleep_for}"
              else
                return 1
              fi

              attempt=$((attempt + 1))
            done

            return 1
          }

          if ! call_json_endpoint "${url}" response.json; then
            cat response.json >&2 || true
            exit 1
          fi

          cat response.json
          echo
